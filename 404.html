<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stránka nenájdená: Párovač platieb</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="./favicon.ico" />
<style>
  :root {
    --paper:#f6f2ea; --paper-2:#fbf9f4; --ink:#1b1a17; --ink-2:#4a4741; --muted:#66625a; --line:#d9d2c4;
    --accent:#b23a1d; --accent-soft:#f3e2dc;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#151412; --paper-2:#1d1b18; --ink:#efe9de; --ink-2:#c9c2b5; --muted:#8f887b; --line:#2e2b26; --accent:#e0623f; --accent-soft:#3a1f17; }
  }
  * { box-sizing:border-box; }
  html { background:var(--paper); }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    color:var(--ink); background:var(--paper); font:16px/1.55 var(--sans); -webkit-font-smoothing:antialiased;
  }
  a { color:inherit; text-decoration-color:var(--line); text-underline-offset:3px; }
  a:hover { text-decoration-color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .card { max-width:480px; width:100%; text-align:center; }
  .kicker { font:400 14px/1 var(--serif); color:var(--accent); letter-spacing:.06em; text-transform:uppercase; margin:0 0 14px; }
  h1 { font:400 clamp(26px,4.5vw,34px)/1.2 var(--serif); letter-spacing:-.01em; margin:0 0 14px; }
  p.sub { color:var(--ink-2); font-size:15.5px; margin:0 0 28px; }
  .btn { display:inline-block; font:600 15px/1 var(--sans); padding:13px 20px; border-radius:4px; text-decoration:none; }
  .btn-solid { background:var(--accent); color:#fff; }
  .btn-solid:hover { background:var(--ink); color:var(--paper); }
  code { font:14px/1.4 var(--mono); background:var(--paper-2); border:1px solid var(--line); border-radius:3px; padding:1px 5px; }
</style>
</head>
<body>
  <div class="card">
    <p class="kicker">Párovač platieb</p>
    <h1>Táto stránka neexistuje.</h1>
    <p class="sub">Ani vo výpise z banky by ste ju nenašli. Vráťte sa a namiesto nej spárujte svoj <code>camt.053</code> výpis s faktúrami.</p>
    <a class="btn btn-solid" href="./">Späť na Párovač platieb</a>
  </div>
</body>
</html>
